[project]
name = "enter-case"
version = "0.1.0"
description = "Case técnico Enter: similaridade de documentos (Q1) e extração de argumentos de sentenças (Q2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
enter = "common.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live"'
markers = ["live: chama a API real da OpenAI (requer OPENAI_API_KEY)"]
